services:
  authoritative:
    build:
      context: .
      dockerfile: Dockerfile.authoritative
    command: -conf /etc/coredns/Corefile.authoritative
    volumes:
      - ./dns:/etc/coredns:ro
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      lab:
        ipv4_address: 172.30.53.54
  resolver:
    build:
      context: .
      dockerfile: Dockerfile.resolver
    depends_on:
      authoritative:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 service.stubline.test A +short | grep -q 192.0.2"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      lab:
        ipv4_address: 172.30.53.53
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    command: sleep infinity
    dns:
      - 172.30.53.53
    depends_on:
      resolver:
        condition: service_healthy
    networks:
      lab:
networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.53.0/24
