server:
    interface: 0.0.0.0
    port: 53
    access-control: 0.0.0.0/0 allow
    do-daemonize: no
    use-syslog: no
    verbosity: 1
    cache-min-ttl: 0
    cache-max-ttl: 30
    neg-cache-size: 1m
    do-not-query-localhost: no
    local-zone: "test." nodefault
    domain-insecure: "stubline.test."
stub-zone:
    name: "stubline.test."
    stub-addr: 172.30.53.54@53
